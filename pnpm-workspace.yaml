# Vendored Kaiju Utils packages (@utils/*); see utils/README.md.
packages:
  - utils/*

allowBuilds:
  esbuild: true
  spawn-sync: false

overrides:
  # GHSA-g3hv-75wg-m249 (minimatch < 11.0.1). minimatch is reached only through
  # shadcn's CLI (shadcn > ts-morph > @ts-morph/common), a build-time tool;
  # @ts-morph/common calls only `minimatch(path, pattern)`, unchanged in 11.
  '@ts-morph/common>minimatch': ^11.0.1
