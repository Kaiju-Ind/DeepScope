# Automatic runs check types. Run this workflow manually for all tests and the Chrome build.
# Cache scope and the required-check migration are documented in docs/ci.md.
name: DeepScope checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Automatic checks replace outdated revisions. Manual builds keep their exact
# source SHA and do not interrupt a build that has already started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
  queue: single

jobs:
  checks:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Tests and Chrome build (manual)' || 'Type checks' }}
    runs-on: ubicloud-standard-2
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 25 || 2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node and pnpm with Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.25"
          cache: true
          cache_save_post: true
          cache_save: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Restore pnpm download store
        uses: Kaiju-Ind/GitHub/.github/actions/dependency-cache@084d0133ac56714027256b12d64e84e9c9c01fc1
        with:
          mode: restore
          stores: pnpm
      - name: Install locked dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Check types
        if: github.event_name != 'workflow_dispatch'
        run: mise exec -- pnpm run compile
      - name: Run all tests and build Chrome extension
        if: github.event_name == 'workflow_dispatch'
        run: mise exec -- pnpm run check:release
      - name: Save successful pnpm download store
        uses: Kaiju-Ind/GitHub/.github/actions/dependency-cache@084d0133ac56714027256b12d64e84e9c9c01fc1
        with:
          mode: save
          stores: pnpm
