name: Verify DeepScope

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Compile, test and build extension
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node and pnpm with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.10.15"
          cache: false
      - name: Install locked dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Compile, test and build for Chrome
        run: mise exec -- pnpm run check:release
