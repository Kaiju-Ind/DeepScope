min_version = "2026.11.5"

[settings]
experimental = true

# Type checking has no build output. Cache its successful result with complete source inputs.
[tasks."ci:compile"]
description = "Type-check WXT source using native Mise artifact caching"
run = "pnpm run compile"
sources = [
  "src/**", "modules/**", "public/**", ".wxt/**",
  "tsconfig.json", "wxt.config.ts", "vitest.config.ts", "components.json",
  "package.json", "pnpm-workspace.yaml", "pnpm-lock.yaml", ".npmrc",
]
outputs = []
cache = { enabled = true, env = ["CI", "NODE_ENV", "NODE_OPTIONS", "WXT_MODE"] }

[tools]
pnpm = "12.18.0"
node = "26.13.0"

# Shared Actions use this immutable revision; application tools stay local.
[vars]
kaiju_tooling_ref = "084d0133ac56714027256b12d64e84e9c9c01fc1"
